name: Build Smart Scan POS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx esbuild scanner-bridge.js --bundle --format=iife --outfile=www/scanner-bridge.js
          sed -i 's#</body>#<script src="scanner-bridge.js"></script></body>#' www/index.html
      - name: Create Android project
        run: npx cap add android
      - name: Install branded Android launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-core
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density=$1
            size=$2
            mkdir -p "android/app/src/main/res/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" assets/app-icon.svg -o "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
      - name: Add Android camera permission and ML Kit metadata
        run: node scripts/patch-android-manifest.js
      - name: Add Android document-save backup plugin
        run: node scripts/patch-android-backup.js
      - name: Sync web app
        run: npx cap sync android
      - name: Ensure branded legacy launcher icon is used
        run: |
          # Capacitor's generated adaptive icon XML overrides mipmap PNGs on Android 8+.
          # Remove those defaults so Android uses the branded density-specific PNGs above.
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Scan-POS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
